# ┌────────────────────────────────────────────────────────────────────────┐
# │ Меню со вкладками: /menu                                               │
# │ Вкладки — у ЛЕВОГО КРАЯ экрана, содержимое — большой панелью ПО ЦЕНТРУ.│
# │ type: edge — диалог (клиент 1.21.6+), без модов.                       │
# └────────────────────────────────────────────────────────────────────────┘
# Как это работает:
#  • вкладки — кликабельный текст шире экрана в теле диалога: такой текст клиент прижимает к левому краю;
#  • панель вкладки — картинка в заголовке диалога: заголовок клиент центрирует по экрану,
#    content-offset (отрицательный ascent) опускает её из шапки в середину экрана, content-shift сдвигает
#    вправо от вкладок, чтобы при масштабе интерфейса 4 панель на них не наезжала;
#  • buttons — обычные кнопки диалога внизу по центру (не больше двух на вкладку);
#  • нажатие на вкладку меняет панель и подсветку, меню не закрывается;
#  • белую рамку фокуса, которую клиент рисует после клика, убирает шейдер core/gui из пака.
#
# Картинки вкладок и панелей рисуются при сборке пака (надписи — заглавными, своим пиксельным шрифтом).
# Своя картинка: PNG с тем же именем в pack/assets/p3rso/textures/gui/edge/edge_menu/
#
# Вкладка:
#   label, icon, style/color          — кнопка слева; name, lore — подсказка при наведении
#   content: {label, subtitle, text: [...], cards: [...], columns, icon, icon-scale, style/color} — панель по центру
#     cards: [{title, text: [...], icon, style/color}] — плашки с информацией на панели
#   sections: {ключ: {label, icon, content, buttons}} — разделы: появляются под вкладкой, когда она открыта
#   buttons: [{label (MiniMessage), name, width, actions}] — кнопки внизу
#   actions: [...]                    — для вкладки без content: что сделать при нажатии

edge_menu:
  type: edge
  command: menu
  tab-width: 112
  content-width: 320
  content-height: 190
  content-offset: -24              # меньше — панель ниже
  content-shift: 136               # сдвиг панели вправо (×½), чтобы не наезжала на вкладки
  warning-offset: 233              # сдвиг значка ⚠, px (−1000…1000): больше — левее, меньше нуля — правее; 233 — по центру экрана
  tabs:
    home:
      label: "Главная"
      icon: item/icon_home
      content:
        label: "ДОБРО ПОЖАЛОВАТЬ"
        subtitle: "P3RSO NETWORK"
        columns: 2
        cards:                           # плашки с информацией (картинка, без %player%)
          - title: "СЕРВЕР"
            icon: item/icon_rpg
            style: success
            text: ["RPG МИР 26.3", "ОНЛАЙН КАЖДЫЙ ДЕНЬ"]
          - title: "НОВОСТИ"
            icon: item/icon_scroll
            style: primary
            text: ["НОВЫЙ ДАНЖ", "«РУБИНОВЫЕ КОПИ»"]
          - title: "ИВЕНТ"
            icon: item/icon_games
            style: blue
            text: ["СУББОТА 18:00", "ПРИЗ — РЕДКИЙ МЕЧ"]
          - title: "НАГРАДА"
            icon: item/icon_gift
            style: gold
            text: ["ЗАХОДИ КАЖДЫЙ", "ДЕНЬ ЗА ПОДАРКОМ"]
      buttons:
        - label: "<green>▶ Играть"
          name: "<gray>Перейти в RPG мир"
          actions: ["close", "command: play"]     # у P3rsoNet это /play

    rpg:
      label: "RPG мир"
      icon: item/icon_rpg
      content:
        label: "RPG МИР"
        subtitle: "СЕЗОН 1"
        icon: item/icon_rpg
        style: success
        text:
          - "ДАНЖИ И БОССЫ"
          - "КЛАССЫ И НАВЫКИ"
          - "ЭКОНОМИКА И ТОРГОВЛЯ"
          - "КЛАНЫ И ВОЙНЫ"
          - ""
          - "ОНЛАЙН КАЖДЫЙ ВЕЧЕР"
      buttons:
        - label: "<green>▶ Играть"
          actions: ["sound: entity.player.levelup 0.6 1.4", "close", "command: play"]

    games:
      label: "Мини-игры"
      icon: item/icon_games
      content:
        label: "МИНИ-ИГРЫ"
        subtitle: "СКОРО"
        icon: item/icon_games
        style: primary
        text:
          - "БЫСТРЫЕ РЕЖИМЫ"
          - "НА 5-10 МИНУТ:"
          - ""
          - "• ПАРКУР"
          - "• СПЛИФ"
          - "• БИТВА СТРОИТЕЛЕЙ"
      buttons:
        - label: "<#c9b6ff>Напомнить"
          actions: ["sound: block.note_block.pling 0.6 0.8", "actionbar: <#c9b6ff>Сообщим, когда откроются!"]

    news:
      label: "Новости"
      icon: item/icon_scroll
      content:
        label: "НОВОСТИ"
        subtitle: "ОБНОВЛЕНИЕ 1.2"
        icon: item/icon_scroll
        text:
          - "• НОВЫЙ ДАНЖ"
          - "  «РУБИНОВЫЕ КОПИ»"
          - "• ИВЕНТ В СУББОТУ"
          - "  В 18:00"
          - "• СКИДКИ -20%"
          - "  ДО КОНЦА НЕДЕЛИ"
      buttons:
        - label: "Подробнее в чат"
          actions:
            - "sound: item.book.page_turn"
            - "message: <newline><#ffe08a><b>Новости сервера</b><newline><gray>• <white>Открыт новый данж «Рубиновые копи»<newline><gray>• <white>Ивент в субботу в 18:00<newline><gray>• <white>Скидки 20% в магазине до конца недели<newline>"

    reward:
      label: "Награда"
      icon: item/icon_gift
      content:
        label: "НАГРАДА"
        subtitle: "КАЖДЫЙ ДЕНЬ"
        icon: item/icon_gift
        style: gold
        text:
          - "ЗАХОДИТЕ КАЖДЫЙ ДЕНЬ"
          - "И ЗАБИРАЙТЕ ПОДАРОК."
          - ""
          - "7 ДНЕЙ ПОДРЯД —"
          - "РЕДКИЙ СУНДУК!"
      buttons:
        - label: "<gold>Забрать"
          actions:
            - "sound: entity.player.levelup 0.5 1.8"
            - "actionbar: <#ffd36e><glyph:star> Награда будет доступна завтра"
            # подключите свой плагин наград: - "console: rewards give %player% daily"

    profile:
      label: "Профиль"
      icon: item/icon_profile
      content:
        label: "ПРОФИЛЬ"
        subtitle: "ВАША СТАТИСТИКА"
        icon: item/icon_profile
        style: blue
        text:
          - "УРОВЕНЬ, КЛАСС, БАЛАНС"
          - "И ДОСТИЖЕНИЯ —"
          - "ПОДКЛЮЧИТЕ СВОЙ ПЛАГИН."
      buttons:
        - label: "Показать в чате"
          actions:
            - "sound: entity.experience_orb.pickup 0.5 1.4"
            - "message: <glyph:star> <#b9a6ff>Профиль <white>%player%"

    shop:
      label: "Магазин"
      icon: item/icon_shop
      content:                           # общая страница вкладки
        label: "ТОРГОВЛЯ"
        subtitle: "ВЫБЕРИТЕ РАЗДЕЛ СЛЕВА"
        columns: 2
        cards:
          - title: "МАГАЗИН"
            icon: item/icon_shop
            style: gold
            text: ["МЕЧИ, БРОНЯ,", "РЕСУРСЫ ЗА РУБИНЫ", "", "ЦЕНЫ ОТ СЕРВЕРА"]
          - title: "АУКЦИОН"
            icon: item/icon_auction
            style: primary
            text: ["ТОРГОВЛЯ", "МЕЖДУ ИГРОКАМИ", "", "СТАВКИ И ЛОТЫ"]
      sections:                          # подвкладки: появляются под «Магазином», когда он открыт
        store:
          label: "Магазин"
          icon: item/icon_shop
          content:
            label: "МАГАЗИН"
            subtitle: "РУБИНОВАЯ ЛАВКА"
            icon: item/icon_shop
            style: gold
            text:
              - "МЕЧИ, БРОНЯ И РЕСУРСЫ."
              - "ПЛАТИТЕ РУБИНАМИ."
              - ""
              - "(ПРИМЕР — ТОЛЬКО"
              - "ДЛЯ АДМИНОВ)"
          buttons:
            - label: "<gold>Открыть магазин"
              actions: ["sound: ui.button.click", "open: shop"]
        auction:
          label: "Аукцион"
          icon: item/icon_auction
          content:
            label: "АУКЦИОН"
            subtitle: "ТОРГОВЛЯ МЕЖДУ ИГРОКАМИ"
            icon: item/icon_auction
            style: primary
            text:
              - "ВЫСТАВЛЯЙТЕ ПРЕДМЕТЫ"
              - "И ДЕЛАЙТЕ СТАВКИ."
              - ""
              - "ЛОТ ДЕРЖИТСЯ 24 ЧАСА."
          buttons:
            - label: "<#c9b6ff>Открыть аукцион"
              actions: ["close", "command: ah"]   # команда вашего плагина аукциона

    items:
      label: "Предметы"
      icon: item/icon_collection
      content:
        label: "ПРЕДМЕТЫ"
        subtitle: "ВСЕ ПРИМЕРЫ"
        icon: item/icon_collection
        text:
          - "РУБИНЫ, МЕЧ, БРОНЯ,"
          - "РУДА, СТУЛ И СТОЛ."
          - ""
          - "(ДЛЯ АДМИНОВ)"
      buttons:
        - label: "Открыть коллекцию"
          actions: ["sound: ui.button.click", "open: collection"]

    close:
      label: "Закрыть"
      icon: item/button_close
      style: danger
      actions: ["sound: block.chest.close 0.5 1.2", "close"]
