# ┌────────────────────────────────────────────────────────────────────────┐
# │ Меню со вкладками: /menu                                               │
# │ Окно по центру экрана: вкладки слева, содержимое вкладки справа.       │
# │ type: edge — диалог (клиент 1.21.6+), без модов и шейдеров.            │
# └────────────────────────────────────────────────────────────────────────┘
# Как это работает: тело диалога — кликабельный текст, каждый элемент меню — картинка внутри
# текста с действием на клик. Строки текста уже экрана, поэтому клиент ставит меню по центру
# (position: left — прижать к левому краю). Нажатие на вкладку меняет панель, меню не закрывается.
#
# Картинки вкладок, панелей и кнопок рисуются при сборке пака (надписи — заглавными, своим
# пиксельным шрифтом). Своя картинка: PNG с тем же именем в pack/assets/p3rso/textures/gui/edge/edge_menu/
#
# width × height — размер окна (до 470 px по ширине, чтобы влезать при масштабе интерфейса 4).
# Вкладка:
#   label, icon, style/color — кнопка слева; name, lore — подсказка при наведении
#   content: {label, subtitle, text: [...], icon, icon-scale, style/color} — панель справа
#   buttons: [{label, icon, style/color, width, name, lore, actions}] — кнопки на панели внизу
#   actions: [...] — для вкладки без content: что сделать при нажатии

edge_menu:
  type: edge
  command: menu
  width: 460
  height: 180
  tab-width: 112
  tabs:
    home:
      label: "Главная"
      icon: item/icon_home
      content:
        label: "ДОБРО ПОЖАЛОВАТЬ"
        subtitle: "P3RSO NETWORK"
        icon: item/icon_home
        text:
          - "ВЫБЕРИТЕ РАЗДЕЛ СЛЕВА."
          - ""
          - "• RPG МИР — ДАНЖИ, КЛАССЫ"
          - "• МИНИ-ИГРЫ — СКОРО"
          - "• МАГАЗИН И НАГРАДЫ"
          - ""
          - "ПРИЯТНОЙ ИГРЫ!"
      buttons:
        - label: "Играть"
          icon: item/icon_rpg
          style: success
          name: "<green>Перейти в RPG мир"
          actions: ["close", "command: play"]     # у P3rsoNet это /play

    rpg:
      label: "RPG мир"
      icon: item/icon_rpg
      content:
        label: "RPG МИР"
        subtitle: "СЕЗОН 1"
        icon: item/icon_rpg
        style: success
        text:
          - "ДАНЖИ И БОССЫ"
          - "КЛАССЫ И НАВЫКИ"
          - "ЭКОНОМИКА И ТОРГОВЛЯ"
          - "КЛАНЫ И ВОЙНЫ"
          - ""
          - "ОНЛАЙН КАЖДЫЙ ВЕЧЕР"
      buttons:
        - label: "Играть"
          icon: item/icon_rpg
          style: success
          actions: ["sound: entity.player.levelup 0.6 1.4", "close", "command: play"]

    games:
      label: "Мини-игры"
      icon: item/icon_games
      content:
        label: "МИНИ-ИГРЫ"
        subtitle: "СКОРО"
        icon: item/icon_games
        style: primary
        text:
          - "БЫСТРЫЕ РЕЖИМЫ"
          - "НА 5-10 МИНУТ:"
          - ""
          - "• ПАРКУР"
          - "• СПЛИФ"
          - "• БИТВА СТРОИТЕЛЕЙ"
      buttons:
        - label: "Напомнить"
          style: primary
          actions: ["sound: block.note_block.pling 0.6 0.8", "actionbar: <#c9b6ff>Сообщим, когда откроются!"]

    news:
      label: "Новости"
      icon: item/icon_scroll
      content:
        label: "НОВОСТИ"
        subtitle: "ОБНОВЛЕНИЕ 1.2"
        icon: item/icon_scroll
        text:
          - "• НОВЫЙ ДАНЖ"
          - "  «РУБИНОВЫЕ КОПИ»"
          - "• ИВЕНТ В СУББОТУ"
          - "  В 18:00"
          - "• СКИДКИ -20%"
          - "  ДО КОНЦА НЕДЕЛИ"
      buttons:
        - label: "Подробнее в чат"
          actions:
            - "sound: item.book.page_turn"
            - "message: <newline><#ffe08a><b>Новости сервера</b><newline><gray>• <white>Открыт новый данж «Рубиновые копи»<newline><gray>• <white>Ивент в субботу в 18:00<newline><gray>• <white>Скидки 20% в магазине до конца недели<newline>"

    reward:
      label: "Награда"
      icon: item/icon_gift
      content:
        label: "НАГРАДА"
        subtitle: "КАЖДЫЙ ДЕНЬ"
        icon: item/icon_gift
        style: gold
        text:
          - "ЗАХОДИТЕ КАЖДЫЙ ДЕНЬ"
          - "И ЗАБИРАЙТЕ ПОДАРОК."
          - ""
          - "7 ДНЕЙ ПОДРЯД —"
          - "РЕДКИЙ СУНДУК!"
      buttons:
        - label: "Забрать"
          icon: item/icon_gift
          actions:
            - "sound: entity.player.levelup 0.5 1.8"
            - "actionbar: <#ffd36e><glyph:star> Награда будет доступна завтра"
            # подключите свой плагин наград: - "console: rewards give %player% daily"

    profile:
      label: "Профиль"
      icon: item/icon_profile
      content:
        label: "ПРОФИЛЬ"
        subtitle: "ВАША СТАТИСТИКА"
        icon: item/icon_profile
        style: blue
        text:
          - "УРОВЕНЬ, КЛАСС, БАЛАНС"
          - "И ДОСТИЖЕНИЯ —"
          - "ПОДКЛЮЧИТЕ СВОЙ ПЛАГИН."
      buttons:
        - label: "Показать в чате"
          actions:
            - "sound: entity.experience_orb.pickup 0.5 1.4"
            - "message: <glyph:star> <#b9a6ff>Профиль <white>%player%"

    shop:
      label: "Магазин"
      icon: item/icon_shop
      content:
        label: "МАГАЗИН"
        subtitle: "РУБИНОВАЯ ЛАВКА"
        icon: item/icon_shop
        style: gold
        text:
          - "МЕЧИ, БРОНЯ И РЕСУРСЫ."
          - ""
          - "(ПРИМЕР — ТОЛЬКО"
          - "ДЛЯ АДМИНОВ)"
      buttons:
        - label: "Открыть лавку"
          icon: item/icon_shop
          actions: ["sound: ui.button.click", "open: shop"]

    items:
      label: "Предметы"
      icon: item/icon_collection
      content:
        label: "ПРЕДМЕТЫ"
        subtitle: "ВСЕ ПРИМЕРЫ"
        icon: item/icon_collection
        text:
          - "РУБИНЫ, МЕЧ, БРОНЯ,"
          - "РУДА, СТУЛ И СТОЛ."
          - ""
          - "(ДЛЯ АДМИНОВ)"
      buttons:
        - label: "Открыть коллекцию"
          actions: ["sound: ui.button.click", "open: collection"]

    close:
      label: "Закрыть"
      icon: item/button_close
      style: danger
      actions: ["sound: block.chest.close 0.5 1.2", "close"]
