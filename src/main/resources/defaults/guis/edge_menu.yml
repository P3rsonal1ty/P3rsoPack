# ┌────────────────────────────────────────────────────────────────────────┐
# │ Меню у ЛЕВОГО КРАЯ ЭКРАНА: /menu                                       │
# │ type: edge — не окно-сундук, а диалог (клиент 1.21.6+), без модов      │
# │ и шейдеров.                                                            │
# └────────────────────────────────────────────────────────────────────────┘
# Как это работает: тело диалога — кликабельный текст шире экрана, а такой текст клиент прижимает
# к левому краю. Каждый элемент — картинка внутри текста с действием на клик; плагин сам раскладывает
# элементы по строкам (по 9 px), так что клик всегда совпадает с картинкой.
#
# Холст: width × height пикселей, (0,0) — левый верхний угол меню.
# Элемент:
#   x, y, width, height — положение и размер в пикселях холста
#   kind: button | panel | header | image
#     button — кнопка: label, icon, style (default/primary/danger/success/gold/blue/dark) или color: "#rrggbb", active
#     panel  — панель: label, subtitle, text (строки), icon (+ icon-scale), pill (кнопка-«таблетка»), style/color
#     header — логотип: label (крупно), subtitle
#     image  — своя картинка: texture (ширина/высота = размер PNG)
#   name, lore — подсказка при наведении (MiniMessage)
#   actions — те же действия, что в обычных окнах (open, command, console, message, actionbar, sound, give, close)
# Картинки рисуются при сборке пака в pack/assets/p3rso/textures/gui/edge/<окно>/<элемент>.png —
# положите туда свою PNG с тем же именем, и плагин будет использовать её.
# Правило раскладки: элементы, стоящие на одних строках (по 9 px), не должны пересекаться по x.
# После клика меню закрывается.

edge_menu:
  type: edge
  command: menu
  width: 252
  height: 196
  background: auto               # auto | none | <текстура>
  elements:
    logo:
      kind: header
      x: 8
      y: 6
      width: 150
      height: 26
      label: "P3RSO"
      subtitle: "ГЛАВНОЕ МЕНЮ"

    # ── боковая панель ─────────────────────────────────────────────────
    home:
      x: 7
      y: 36
      label: "Главная"
      icon: item/icon_home
      style: primary
      active: true
      name: "<#c9b6ff>Главная"
      lore: ["<gray>Вы здесь"]
      actions: ["sound: ui.button.click"]
    rpg:
      x: 7
      y: 54
      label: "RPG мир"
      icon: item/icon_rpg
      name: "<#7dffc4><b>RPG мир"
      lore: ["<gray>Основной сервер с данжами,", "<gray>классами и экономикой."]
      actions: ["sound: entity.player.levelup 0.6 1.4", "command: play"]   # у P3rsoNet это /play
    games:
      x: 7
      y: 72
      label: "Мини-игры"
      icon: item/icon_games
      name: "<#c9b6ff>Мини-игры"
      lore: ["<gray>Скоро здесь появятся быстрые режимы."]
      actions: ["sound: block.note_block.pling 0.6 0.8", "actionbar: <#c9b6ff>Мини-игры скоро!"]
    profile:
      x: 7
      y: 90
      label: "Профиль"
      icon: item/icon_profile
      name: "<#b9a6ff>Профиль"
      lore: ["<gray>Игрок: <white>%player%"]
      actions:
        - "sound: entity.experience_orb.pickup 0.5 1.4"
        - "message: <newline><glyph:star> <#b9a6ff>Профиль <white>%player%<newline><gray>  Сюда можно вывести уровень, класс и баланс.<newline>"
    shop:
      x: 7
      y: 108
      label: "Магазин"
      icon: item/icon_shop
      name: "<#ffd36e>Магазин"
      lore: ["<gray>Рубиновая лавка", "<dark_gray>(пример, для админов)"]
      actions: ["sound: ui.button.click", "open: shop"]
    items:
      x: 7
      y: 126
      label: "Предметы"
      icon: item/icon_collection
      name: "<#7fb8ff>Предметы"
      lore: ["<gray>Все примеры P3rsoPack", "<dark_gray>(для админов)"]
      actions: ["sound: ui.button.click", "open: collection"]
    other:
      x: 7
      y: 153
      label: "Ещё меню"
      icon: item/icon_back
      style: blue
      name: "<#7fb8ff>Другие меню"
      lore: ["<gray>Полноэкранное меню-сундук"]
      actions: ["sound: ui.button.click", "open: hub_menu"]
    close:
      x: 7
      y: 171
      label: "Закрыть"
      icon: item/button_close
      style: danger
      name: "<#ff7a7a>Закрыть"
      actions: ["sound: block.chest.close 0.5 1.2", close]

    # ── содержимое ─────────────────────────────────────────────────────
    banner:
      kind: panel
      x: 93
      y: 36
      width: 152
      height: 52
      style: success
      label: "RPG МИР"
      subtitle: "СЕЗОН 1"
      icon: item/icon_rpg
      icon-scale: 2
      pill: "ИГРАТЬ"
      name: "<#7dffc4><b>RPG мир · Сезон 1"
      lore: ["<gray>Новые данжи и классы.", "", "<#7dffc4>▶ Нажмите, чтобы играть"]
      actions: ["sound: entity.player.levelup 0.6 1.4", "command: play"]
    news:
      kind: panel
      x: 93
      y: 90
      width: 152
      height: 52
      style: dark
      label: "НОВОСТИ"
      icon: item/icon_scroll
      text: ["• НОВЫЙ ДАНЖ", "• ИВЕНТ В СУББОТУ", "• СКИДКИ -20%"]
      name: "<#ffe08a>Новости"
      lore: ["<gray>Нажмите, чтобы прочитать полностью"]
      actions:
        - "sound: item.book.page_turn"
        - "message: <newline><#ffe08a><b>Новости сервера</b><newline><gray>• <white>Открыт новый данж «Рубиновые копи»<newline><gray>• <white>Ивент в субботу в 18:00<newline><gray>• <white>Скидки 20% в магазине до конца недели<newline>"
    reward:
      kind: panel
      x: 93
      y: 144
      width: 152
      height: 45
      style: gold
      label: "НАГРАДА"
      subtitle: "ЗАХОДИ КАЖДЫЙ ДЕНЬ"
      icon: item/icon_gift
      icon-scale: 2
      pill: "ЗАБРАТЬ"
      name: "<gradient:#ffe9a8:#ffb347><b>Ежедневная награда"
      lore: ["<gray>Заходите каждый день и забирайте подарок."]
      actions:
        - "sound: entity.player.levelup 0.5 1.8"
        - "actionbar: <#ffd36e><glyph:star> Награда будет доступна завтра"
        # подключите свой плагин наград: - "console: rewards give %player% daily"
