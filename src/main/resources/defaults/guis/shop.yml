# Окна. Открыть: /p3rsopack gui shop
# Действия (actions): "тип: значение"
#   command: <команда от игрока>      console: <команда от консоли>
#   open: <id окна>                   close
#   message: <MiniMessage>            actionbar: <MiniMessage>
#   sound: <звук> [громкость] [тон]   give: <id предмета> [кол-во]
#   refresh                            — перерисовать окно
# %player% заменяется на ник. Отдельные действия по клику: left-actions, right-actions,
# shift-left-actions, shift-right-actions, middle-actions, drop-actions.

shop:
  title: "<white>Рубиновая лавка"
  rows: 6
  permission: p3rsopack.admin    # окно выдаёт предметы бесплатно — только для админов
  background: menu               # глиф-фон из glyphs/
  title-offset: 0                # сдвиг текста заголовка
  items:
    ruby:
      slot: 13
      item: ruby
      lore:
        - "<gray>ЛКМ — получить рубин"
        - "<gray>ПКМ — получить 16"
      left-actions:
        - "give: ruby 1"
        - "sound: entity.experience_orb.pickup"
      right-actions:
        - "give: ruby 16"
        - "actionbar: <green>+16 рубинов"
    sword:
      slot: 22
      item: ruby_sword
      actions:
        - "console: say %player% смотрит на рубиновый меч"
    menu:
      slot: 45
      item: icon_back
      name: "<#ffd36e>В главное меню"
      actions:
        - "open: main_menu"
    next:
      slot: 53
      item: button_next
      actions:
        - "open: shop_page2"
    close:
      slot: 49
      item: button_close
      actions:
        - close

shop_page2:
  title: "<white>Страница 2 <glyph:ruby_icon>"
  rows: 6
  permission: p3rsopack.admin
  background: menu
  open-actions:
    - "sound: ui.button.click"
  items:
    armor:
      slots: [20, 21-22]
      item: ruby_helmet
      actions:
        - "give: ruby_helmet"
    vanilla:
      slot: 24
      material: DIAMOND
      name: "<aqua>Обычный алмаз"
      lore: ["Можно использовать и ванильные предметы"]
      actions:
        - "message: <aqua>Это просто алмаз, %player%"
    back:
      slot: 45
      material: ARROW
      name: "<yellow>Назад"
      actions:
        - "open: shop"
